name: Issue trigger workflow

permissions:
  issues: write

on:
  issues:
    types: [opened, closed, edited, labeled]

jobs:
  issue_trigger_job:
    runs-on: ubuntu-latest
    steps:
      - name: Log issue event
        run: echo "Issue event triggered: ${{ github.event.action }} on issue #${{ github.event.issue.number }}"
      - name: Add comment to issue
        if: github.event.action == 'opened'
        uses: actions/github-script@v6
        with:
          script: |
            const issueNumber = context.payload.issue.number;
            const commentBody = `Thank you for opening this issue! We will review it as soon as possible.`;
            await github.issues.createComment({
              issue_number: issueNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: commentBody
            });
      - name: Add label to issue
        if: github.event.action == 'opened'
        uses: actions/github-script@v6
        with:
          script: |
            const issueNumber = context.payload.issue.number;
            const labelName = 'triage';
            await github.issues.addLabels({
              issue_number: issueNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: [labelName]
            });
      - name: Log issue closed event
        if: github.event.action == 'closed'
        run: echo "Issue #${{ github.event.issue.number }} has been closed."
      - name: Log issue edited event
        if: github.event.action == 'edited'
        run: echo "Issue #${{ github.event.issue.number }} has been edited."
      - name: Log issue labeled event
        if: github.event.action == 'labeled'
        run: echo "Issue #${{ github.event.issue.number }} has been labeled with '${{ github.event.label.name }}'."
        