name: "Estrutura de Diretorios e Arquivos"

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: "18"

jobs:
  demostrar-estrutura:
    name: "Demonstrar Estrutura Básica"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Mostrar estrutura .github/workflow
        run: |
          echo " == ESTRUTURA DE DIRETÓRIOS E ARQUIVOS .github/workflows == "
          ls -la .github/workflows
          echo ""
          echo "Total de workflows: $(ls -1 .github/workflows | wc -l)"

      - name: Elementos obrigatórios do workflow
        run: |
          echo " == ELEMENTOS OBRIGATÓRIOS"
          echo "1 - name: Nome do WorkFlow"
          echo "2 - on: Evento que dispara o workflow"
          echo "3 - jobs: Definição dos trabalhos a serem executados"
          echo "4 - runs-on: Ambientes onde o job será executado"
          echo "5 - steps: Passos individuais dentro do jobs"
          echo ""
          echo "Total de elementos obrigatórios 5"

      - name: Variaveis e Contexto
        run: |
          echo " == Variaveis de Contexo"
          echo "Variáveis env: ${{ env.NODE_VERSION }}"
