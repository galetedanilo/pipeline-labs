name: Hello Github Actions

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  hello-job:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Códgio
        uses: actions/checkout@v4

      - name: Executar Hello Word
        run: echo "Hello Github Actions"

      - name: Mostrar informações do Sistema
        run: |
          echo "Sistema Operaciona ${{ runner.os }}"
          echo "Diretório atual: $(pwd)"
          echo "Data atual: $(date)}"
          echo "SUsuário: $(whoami)"

      - name: Listar arquivos do repositório
        run: ls -la
